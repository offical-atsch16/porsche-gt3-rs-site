kind = "web"
previewPath = "/"
title = "Porsche 911 GT3 RS"
version = "1.0.0"
id = "artifacts/porsche-gt3rs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20487

[services.development]
run = "pnpm --filter @workspace/porsche-gt3rs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/porsche-gt3rs", "run", "build" ]
publicDir = "artifacts/porsche-gt3rs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20487"
BASE_PATH = "/"
